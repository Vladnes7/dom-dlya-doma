# Демо сайта кафе «Дом для дома» на VPS Timeweb: http://37.77.106.12:8082/
# Отдельный порт, чтобы не трогать портфолио (80/443) и Archipila (8081).
server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /var/www/dom-dlya-doma;
    index index.html;

    # Демо закрыто от поиска и на уровне заголовков
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    error_page 404 /404.html;
}
